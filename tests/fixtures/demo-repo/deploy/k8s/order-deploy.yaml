apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: commerce
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: order
          image: ghcr.io/northstar/order-service:1.18.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: commerce
spec:
  ports:
    - port: 80
